name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Apple Silicon, because the R-PERF budgets and the shipped app both live there.
  rust:
    name: rust
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins the version; rustup on the runner installs it on first use.
      - name: Toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      # Differential tests drive Actual's real engine and read the pinned reference
      # checkout. VERITAS_REQUIRE_ORACLE makes them fail instead of skip, so a green
      # run always means parity was actually checked.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tools/actual-oracle/package-lock.json

      - name: Oracle and reference
        run: |
          cargo xtask oracle setup
          cargo xtask reference

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        if: ${{ !cancelled() }}
        env:
          VERITAS_REQUIRE_ORACLE: 1
        run: cargo test --workspace

  # PLAN §10: every core-measurable R-PERF budget on perf-100k, in a release
  # build. `cargo xtask perf` reads criterion's median of each bench and fails
  # when one is over its budget (docs/acceptance.md, Performance).
  perf:
    name: perf
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: R-PERF budgets
        run: cargo xtask perf

  scripts:
    name: scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Merge-bar tests
        run: node --test '.github/scripts/*.test.ts'

  # Actual's real engine, pinned. The offline test uses macOS sandbox-exec to deny
  # all network access, so this job runs on macOS too.
  oracle:
    name: oracle
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/actual-oracle
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tools/actual-oracle/package-lock.json

      - name: Install the pinned oracle
        run: npm ci --no-fund --no-audit

      - name: Oracle tests
        run: npm test

  # The Swift side of the bridge: generate bindings from the core, then run the
  # package tests against the linked static library.
  swift:
    name: swift
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Toolchains
        run: |
          rustup show active-toolchain
          swift --version
          sw_vers

      - uses: Swatinem/rust-cache@v2

      - name: Generate the Swift bindings
        run: cargo xtask bindings

      # The AI plug-in first: VeritasKit's tests load the dylib it builds.
      - name: AI plug-in tests
        working-directory: apps/macos/Packages/VeritasAI
        run: |
          swift build --product VeritasAIPlugin
          swift test

      - name: Swift tests
        working-directory: apps/macos/Packages/VeritasKit
        run: swift test

  # The app needs the macOS 27 SDK, which only GitHub's xcode-27 preview image has.
  # Not a required check while the image is in preview. UI tests may fail: hosted
  # runners don't enable UI automation, so the runner starts no tests there.
  app:
    name: app
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # The newest Xcode 27.x on the image, whichever point release that is.
      - name: Toolchains
        run: |
          xcode=$(ls -d /Applications/Xcode_27*.app | sort -t. -k2,2n -k3,3n | tail -1)
          echo "Using $xcode"
          sudo xcode-select -s "$xcode"
          rustup show active-toolchain
          swift --version
          sw_vers

      - uses: Swatinem/rust-cache@v2

      - name: Generate the Swift bindings
        run: cargo xtask bindings

      # The AI plug-in first: VeritasKit's tests load the dylib it builds.
      - name: AI plug-in tests
        working-directory: apps/macos/Packages/VeritasAI
        run: |
          swift build --product VeritasAIPlugin
          swift test

      - name: Swift tests
        working-directory: apps/macos/Packages/VeritasKit
        run: swift test

      - name: Build the app
        run: cargo xtask app

      # §10 D5: with AI off nothing AI-related loads, so only the plug-in links FoundationModels.
      # Every file in the bundle outside PlugIns is checked; otool skips files that aren't Mach-O.
      - name: Only the AI plug-in links FoundationModels
        run: |
          app=target/xcode/Build/Products/Debug/Veritas.app
          linked=$(find "$app/Contents" -path "$app/Contents/PlugIns" -prune -o -type f -print0 \
            | xargs -0 -n1 sh -c 'otool -L "$0" 2>/dev/null | grep -q FoundationModels.framework && echo "$0"; true')
          if [ -n "$linked" ]; then
            echo "These link FoundationModels:"
            echo "$linked"
            exit 1
          fi
          otool -L "$app/Contents/PlugIns/VeritasAI.bundle/Contents/MacOS/VeritasAI" | grep -q FoundationModels.framework

      - name: UI tests
        continue-on-error: true
        run: cargo xtask app-test
