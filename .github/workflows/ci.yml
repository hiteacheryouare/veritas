name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Apple Silicon, because the R-PERF budgets and the shipped app both live there.
  rust:
    name: rust
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins the version; rustup on the runner installs it on first use.
      - name: Toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      # Differential tests drive Actual's real engine and read the pinned reference
      # checkout. VERITAS_REQUIRE_ORACLE makes them fail instead of skip, so a green
      # run always means parity was actually checked.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tools/actual-oracle/package-lock.json

      - name: Oracle and reference
        run: |
          cargo xtask oracle setup
          cargo xtask reference

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        if: ${{ !cancelled() }}
        env:
          VERITAS_REQUIRE_ORACLE: 1
        run: cargo test --workspace

  scripts:
    name: scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Merge-bar tests
        run: node --test '.github/scripts/*.test.ts'

  # Actual's real engine, pinned. The offline test uses macOS sandbox-exec to deny
  # all network access, so this job runs on macOS too.
  oracle:
    name: oracle
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/actual-oracle
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tools/actual-oracle/package-lock.json

      - name: Install the pinned oracle
        run: npm ci --no-fund --no-audit

      - name: Oracle tests
        run: npm test

  # The Swift side of the bridge: generate bindings from the core, then run the
  # package tests against the linked static library.
  swift:
    name: swift
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Toolchains
        run: |
          rustup show active-toolchain
          swift --version
          sw_vers

      - uses: Swatinem/rust-cache@v2

      - name: Generate the Swift bindings
        run: cargo xtask bindings

      - name: Swift tests
        working-directory: apps/macos/Packages/VeritasKit
        run: swift test

  # The app needs the macOS 27 SDK, which only GitHub's xcode-27 preview image has.
  # Not a required check while the image is in preview. UI tests are allowed to fail
  # until automation mode is proven on hosted runners.
  app:
    name: app
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Toolchains
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          rustup show active-toolchain
          swift --version
          sw_vers

      - uses: Swatinem/rust-cache@v2

      - name: Generate the Swift bindings
        run: cargo xtask bindings

      - name: Swift tests
        working-directory: apps/macos/Packages/VeritasKit
        run: swift test

      - name: Build the app
        run: cargo xtask app

      - name: UI tests
        continue-on-error: true
        run: cargo xtask app-test
