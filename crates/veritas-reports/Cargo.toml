[package]
name = "veritas-reports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
serde_json.workspace = true
veritas-domain = { path = "../veritas-domain" }
veritas-engine = { path = "../veritas-engine" }
veritas-rules = { path = "../veritas-rules" }

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
rusqlite.workspace = true
# The oracle prints large results as JSON numbers; the default parser can
# read them back an ulp off, which would fail a bit-exact comparison.
serde_json = { workspace = true, features = ["float_roundtrip"] }
veritas-interop = { path = "../veritas-interop" }
veritas-store = { path = "../veritas-store" }

[[bench]]
name = "perf"
harness = false

[lints]
workspace = true
