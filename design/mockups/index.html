<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veritas mockups</title>
<link rel="stylesheet" href="../tokens.css">
<style>
* { box-sizing: border-box; }
body { margin: 0; background: var(--color-surface-window); color: var(--color-text-primary); font-family: var(--font-text); font-size: 14px; line-height: var(--line-body); -webkit-font-smoothing: antialiased; }
.page { max-width: 1440px; margin: 0 auto; padding: var(--space-7) var(--space-5); }
.intro { display: flex; align-items: center; gap: var(--space-5); flex-wrap: wrap; margin-bottom: var(--space-6); }
.intro h1 { margin: 0; font-size: 28px; font-weight: var(--weight-semibold); }
.doc-links { display: flex; gap: var(--space-4); }
.doc-links a { color: var(--color-accent); text-decoration: none; }
.switches { margin-left: auto; display: flex; gap: var(--space-3); }
.view-switch { display: flex; gap: 2px; background: var(--color-track); padding: 2px; border-radius: 8px; }
.view-switch button { border: 0; background: transparent; font: inherit; font-size: 13px; padding: 4px 14px; border-radius: 6px; cursor: pointer; color: var(--color-text-primary); }
.view-switch button[aria-pressed="true"] { background: var(--color-surface-raised); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12); }
button:focus-visible, a:focus-visible { outline: 2px solid var(--color-focus-ring); outline-offset: 2px; }
.area { margin-bottom: var(--space-6); }
.area h2 { margin: 0 0 var(--space-3); font-size: var(--text-title); font-weight: var(--weight-semibold); }
.screens { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: var(--space-5); }
.screen { display: flex; flex-direction: column; gap: var(--space-2); color: inherit; text-decoration: none; }
.preview { position: relative; aspect-ratio: 1280 / 800; border-radius: 12px; overflow: hidden; background: var(--color-surface-grouped); box-shadow: 0 0 0 1px var(--color-edge-grouped), 0 10px 24px rgba(0, 0, 0, 0.1); }
.preview iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
.screen h3 { margin: 0; font-size: var(--text-heading); font-weight: var(--weight-semibold); }
.screen:hover h3 { color: var(--color-accent); }
</style>
</head>
<body>
<div class="page">
	<div class="intro">
		<h1>Veritas mockups</h1>
		<nav class="doc-links"><a href="../tokens.md">Tokens</a><a href="../interaction.md">Interaction notes</a></nav>
		<div class="switches">
			<div class="view-switch theme-switch" role="group" aria-label="Preview appearance">
				<button type="button" data-view="light" aria-pressed="true">Light</button>
				<button type="button" data-view="dark" aria-pressed="false">Dark</button>
			</div>
		</div>
	</div>

	<section class="area">
		<h2>Budget and goals</h2>
		<div class="screens">
			<a class="screen" href="budget.html"><div class="preview"><iframe data-src="budget.html" title="Budget" tabindex="-1"></iframe></div><h3>Budget</h3></a>
			<a class="screen" href="budget-dense.html"><div class="preview"><iframe data-src="budget-dense.html" title="Budget, dense" tabindex="-1"></iframe></div><h3>Budget, dense</h3></a>
			<a class="screen" href="goals.html"><div class="preview"><iframe data-src="goals.html" title="Goals" tabindex="-1"></iframe></div><h3>Goals</h3></a>
			<a class="screen" href="goal-close.html"><div class="preview"><iframe data-src="goal-close.html" title="Close goal" tabindex="-1"></iframe></div><h3>Close goal</h3></a>
		</div>
	</section>

	<section class="area">
		<h2>Accounts and bills</h2>
		<div class="screens">
			<a class="screen" href="register.html"><div class="preview"><iframe data-src="register.html" title="Register" tabindex="-1"></iframe></div><h3>Register</h3></a>
			<a class="screen" href="move-money.html"><div class="preview"><iframe data-src="move-money.html" title="Move money" tabindex="-1"></iframe></div><h3>Move money</h3></a>
			<a class="screen" href="quick-entry.html"><div class="preview"><iframe data-src="quick-entry.html" title="Quick entry" tabindex="-1"></iframe></div><h3>Quick entry</h3></a>
			<a class="screen" href="bills.html"><div class="preview"><iframe data-src="bills.html" title="Bills" tabindex="-1"></iframe></div><h3>Bills</h3></a>
		</div>
	</section>

	<section class="area">
		<h2>Reports and insights</h2>
		<div class="screens">
			<a class="screen" href="net-profit.html"><div class="preview"><iframe data-src="net-profit.html" title="Net Profit" tabindex="-1"></iframe></div><h3>Net Profit</h3></a>
			<a class="screen" href="sankey.html"><div class="preview"><iframe data-src="sankey.html" title="Sankey" tabindex="-1"></iframe></div><h3>Sankey</h3></a>
			<a class="screen" href="forecast.html"><div class="preview"><iframe data-src="forecast.html" title="Forecast" tabindex="-1"></iframe></div><h3>Forecast and what-ifs</h3></a>
			<a class="screen" href="wrapped.html"><div class="preview"><iframe data-src="wrapped.html" title="Wrapped" tabindex="-1"></iframe></div><h3>Wrapped card</h3></a>
			<a class="screen" href="statement.html"><div class="preview"><iframe data-src="statement.html" title="Statement" tabindex="-1"></iframe></div><h3>Statement</h3></a>
		</div>
	</section>

	<section class="area">
		<h2>Settings</h2>
		<div class="screens">
			<a class="screen" href="tags.html"><div class="preview"><iframe data-src="tags.html" title="Tags" tabindex="-1"></iframe></div><h3>Tags</h3></a>
		</div>
	</section>
</div>
<script>
const frames = document.querySelectorAll('.preview iframe');
const show = (view) => {
	document.documentElement.dataset.theme = view;
	frames.forEach((f) => { f.src = `${f.dataset.src}?embed&view=${view}`; });
	document.querySelectorAll('.theme-switch button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === view)));
};
document.querySelectorAll('.theme-switch button').forEach((b) => b.addEventListener('click', () => show(b.dataset.view)));
show(matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
</script>
</body>
</html>
